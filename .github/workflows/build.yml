name: Build APK
on:
  workflow_dispatch:
  push:
env:
  WEB_CLIENT_ID: "YOUR_WEB_CLIENT_ID.apps.googleusercontent.com"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Calmify.zip
      - run: sed -i "s|YOUR_WEB_CLIENT_ID.apps.googleusercontent.com|$WEB_CLIENT_ID|" Calmify/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd Calmify && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Calmify-APK
          path: Calmify/app/build/outputs/apk/debug/app-debug.apk
